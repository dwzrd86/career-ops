# Local, versioned preferences for Career Ops autonomous discovery.
# Copy to config/target-profile.yml, then run `npm run profile -- edit`.

schemaVersion: 1
profileVersion: 0
updatedAt: null

targetRoles:
  - title: "Cloud Security Architect"
    aliases:
      - "Security Architect"
      - "Enterprise Security Architect"
    priority: primary
    seniority:
      - "Principal"
      - "Director"

location:
  home: "Nashville, TN"
  radiusMiles: 50
  workplaceModes:
    - remote
    - hybrid
  allowedRegions:
    - "United States"
  excludedRegions: []

compensation:
  floor: 180000
  target: 220000
  currency: USD
  basis: annual

eligibility:
  workAuthorization:
    - "United States work authorized"
  clearance:
    required: false
    levels: []

preferences:
  industries:
    - cybersecurity
    - cloud
    - healthcare
  excludedIndustries: []
  companies: []
  excludedCompanies: []

expertise:
  frameworks:
    - "NIST CSF"
    - "NIST 800-53"
    - "ISO 27001"
    - "SOC 2"
  cloudPlatforms:
    - AWS
    - Azure
  tools:
    - IAM
    - SIEM
  skills:
    - "Security architecture"
    - "Zero Trust"

criteria:
  mustHave:
    - "Security architecture ownership"
  dealBreakers:
    - "Requires relocation outside approved regions"
  notes: ""

# References stay local. Store paths or local identifiers, not resume contents.
evidenceReferences:
  - kind: resume
    localPath: cv.md
    label: "Primary resume"
    updatedAt: null

discovery:
  sources:
    - greenhouse
    - ashby
    - lever
  schedule: "manual"
  maxPerRun: 100
  enabled: true
